stages:
  - build
  - deploy

# Cache modules in between jobs
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
  - node_modules/

# Electron app build
build:
  stage: build
  image: electronuserland/builder:wine
  script:
    - npm install
    - npm run build:app
    - npm run release
  artifacts:
    name: "dist"
    expire_in: 1 hour
    paths:
      - "./release-builds/*.AppImage"
      - "./release-builds/*.exe"
      - "./release-builds/*.exe.blockmap"
      - "./release-builds/latest*.yml"
      - "./release-builds/beta*.yml"
  only:
    - web
    - tags

deploy:
  stage: deploy
  dependencies:
    - build
  image: ubuntu:latest
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_PRIVATE_KEY_BASE64" | base64 --decode)
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:
    - 'which rsync || ( apt-get update -y && apt-get install rsync -y )'
    - mkdir -p "./release-builds"
    - rsync -hrvz -e ssh release-builds/ ci-user@openflexure.bath.ac.uk:/var/www/build/openflexure-ev/
  only:
    - web

