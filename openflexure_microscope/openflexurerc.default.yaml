# The analog gain offers higher sensitivity and less noise than using digital gain only
analog_gain: 1.
digital_gain: 1.

# Resolutions for streaming and capture
video_resolution: [832, 624]
image_resolution: [2592, 1944]
numpy_resolution: [1312, 976]

# Capture quality
jpeg_quality: 75

picamera_params:
  exposure_mode: 'off'
  awb_mode: 'off'
  awb_gains: [1.3, 1.2]
  framerate: 24
  shutter_speed: 30000
  saturation: 0
  led: false