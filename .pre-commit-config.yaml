repos:
  - repo: https://github.com/psf/black
    rev: 19.10b0
    hooks:
      - id: black
  - repo: https://github.com/timothycrosley/isort
    rev: 5.4.2
    hooks:
      - id: isort
        additional_dependencies: [toml]
        exclude: ^.*/?setup\.py$
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: poetry run pylint
        files: "./openflexure_microscope/"
        language: system
        types: [python]
